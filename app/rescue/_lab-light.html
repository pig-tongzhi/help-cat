<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>方案 A · 浅色（换取景）</title>
<style>
  :root { --brand: #D9683A; --brand-dark: #B94A26; --ink: #1D1D1F; --muted: #6E6E73; --faint: #86868B; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif; }
  .stage { position: relative; overflow: hidden;
    background: radial-gradient(56% 50% at 73% 58%, rgba(217,104,58,.08), rgba(217,104,58,0) 74%),
                linear-gradient(180deg, #FFFFFF 0%, #FBFAF8 42%, #F5F1EB 100%); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; min-height: 720px; }
  .copy { position: relative; z-index: 2; align-self: center; padding: clamp(32px, 4.6vw, 76px); }
  .eyebrow { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .16em; }
  h1 { margin: 0; font-size: clamp(34px, 4.9vw, 74px); font-weight: 600; line-height: 1.06; letter-spacing: -.04em; }
  .lede { max-width: 40ch; margin: 20px 0 0; color: var(--muted); font-size: clamp(16px, 1.5vw, 21px); line-height: 1.5; }
  .region { margin-top: 22px; color: var(--faint); font-size: 13px; }
  .region i { display: inline-block; width: 6px; height: 6px; margin-right: 7px; border-radius: 50%; background: var(--brand); }
  .actions { display: flex; align-items: center; gap: 26px; margin-top: 30px; }
  .pill { display: inline-flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 28px; border: 0; border-radius: 999px;
    background: var(--brand); color: #171717; font-size: 16px; font-weight: 600; }
  .link { color: var(--brand-dark); font-size: 16px; text-decoration: none; }
  .note { margin: 30px 0 0; color: var(--faint); font-size: 12.5px; }
  .portrait { position: relative; z-index: 1; min-width: 0; }
  .portrait img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 58% center;
    -webkit-mask-image: linear-gradient(180deg, #000 87%, transparent); mask-image: linear-gradient(180deg, #000 87%, transparent); }
  .label { position: fixed; left: 16px; bottom: 16px; z-index: 9; padding: 7px 13px; border-radius: 999px;
    background: rgba(29,29,31,.85); color: #fff; font-size: 12px; }
  @media (max-width: 720px) {
    .grid { grid-template-columns: 1fr; min-height: 0; }
    .portrait { height: 380px; }
    .portrait img { object-fit: contain; object-position: center bottom; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="grid">
    <div class="copy">
      <span class="eyebrow">招同行人</span>
      <h1>让每一只小猫，<br>都被认真看见</h1>
      <p class="lede">杭州富阳的社区流浪猫投喂与伤病救助。懂网站开发的、有喂猫经验的、单纯喜欢猫的，都欢迎加入。</p>
      <div class="region"><i></i>杭州市 · 富阳区 · 银湖街道</div>
      <div class="actions"><button class="pill">77 的故事 →</button><a class="link" href="#">欢迎页 ›</a></div>
      <p class="note">初见 77 · 2025 年 6 月 2 日，名字来自农历五月初七</p>
    </div>
    <div class="portrait"><img src="_lab-77-square.webp" alt="77"></div>
  </div>
</div>
<div class="label">方案 A · 浅色底 + 换成「头+胸」取景</div>
</body>
</html>
