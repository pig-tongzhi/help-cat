server {
    server_name helpcat.xyz www.helpcat.xyz;

    root /opt/help-cat/current/app/welcome;
    index index.html;

    access_log /var/log/nginx/helpcat.access.log main;
    error_log /var/log/nginx/helpcat.error.log warn;
    client_max_body_size 10m;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /admin/index.html {
        alias /opt/help-cat/current/admin/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location /admin {
        alias /opt/help-cat/current/admin;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # 欢迎页是站点文档根。它用相对路径 ../rescue/ 引用 H5 与品牌图标，
    # 所以这里必须给出 /rescue/，否则扫码进来点「进入帮帮小猫」会 404。
    location /rescue/ {
        alias /opt/help-cat/current/app/rescue/;
    }

    location /welcome/ {
        alias /opt/help-cat/current/app/welcome/;
        index index.html;
    }

    location /help-cat/rescue/ {
        add_header Cache-Control "public, max-age=604800" always;
        alias /opt/help-cat/current/app/rescue/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # 图片直出：FastAPI 只做存在性校验并返回 X-Accel-Redirect，字节由 nginx 读。
    location /__media/ {
        internal;
        alias /opt/help-cat/data/uploads/;
    }
    location /help-cat-api/ {
        proxy_pass http://127.0.0.1:18000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        alias /opt/help-cat/release/docs;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/helpcat.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/helpcat.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.helpcat.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = helpcat.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name helpcat.xyz www.helpcat.xyz;
    return 404; # managed by Certbot




}
