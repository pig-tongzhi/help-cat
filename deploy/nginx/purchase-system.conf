server {
    listen 80;
    server_name 175.178.41.19;

    root /data/purchase-system/frontend/dist;
    index index.html;

    access_log /var/log/nginx/purchase-system.access.log main;
    error_log /var/log/nginx/purchase-system.error.log warn;

    client_max_body_size 50m;

    location ^~ /ninebot-api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location ^~ /ninebot/ {
        root /opt/ninebot-ims/public;
        try_files $uri $uri/ /ninebot/index.html;
    }

    location = /help-cat { return 302 /help-cat/rescue/index.html; }

    location = /help-cat/rescue/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # 静态素材不能走 SPA 回退：缺一张图时回 HTML(200) 会让"图片挂了"变成很难查的
    # 静默失败（线上真踩过：发布漏打包一张 webp，页面只是不显示照片）。
    # 这里只对 assets/ 前缀生效，缺失就是 404；注意这里不加 always，
    # 免得把 404 也标成 7 天缓存。
    location /help-cat/rescue/assets/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location /help-cat/ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri $uri/ /help-cat/rescue/index.html;
    }


    # 图片直出：FastAPI 只做存在性校验并返回 X-Accel-Redirect，字节由 nginx 读。
    location /__media/ {
        internal;
        alias /opt/help-cat/data/uploads/;
    }
    location /help-cat-api/ {
        proxy_pass http://127.0.0.1:18000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
