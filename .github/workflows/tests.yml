name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"     # 与线上目标环境一致（本地开发机是 3.9）
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-commercial.txt
          pip install pytest httpx
      - name: Run the suite
        run: |
          # tests/ 与 server/tests/ 分开跑：前者是前端契约，后者是 API 行为
          python -m pytest server/tests -q
          python -m pytest tests -q \
            --deselect tests/test_commercial_migrations.py::CommercialMigrationTests::test_alembic_upgrade_executes_against_legacy_sqlite_and_reconciles_collisions
        # 说明：上面 deselect 的那条是**基线就存在**的失败（001 迁移用 create_all，
        # 从空库跑迁移链会撞 "table already exists"）。它属于「schema 单一来源」那项
        # 结构优化，修完之后应把这行删掉。
